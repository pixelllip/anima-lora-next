name: upstream-sync

# 下游整合版的"上游跟版"：每天把 sorryhyun/anima_lora 的 main 合进本仓库，
# 干净就开 PR（可选手动开自动合），有冲突就把带冲突标记的分支推上来 + 点名冲突文件。
#
# 为什么不是直接 push 到 main：合并结果要让守卫测试与人工过一眼 —— 上游重构
# 训练器/推理链时，"能合并"不等于"我们的缝合点还在"。

on:
  schedule:
    - cron: '17 3 * * *' # UTC 03:17 = 北京时间 11:17
  workflow_dispatch:
    inputs:
      auto_merge:
        description: 同步 PR 的 CI 变绿后自动合并
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 需要历史才能算 drift / 做真正的 merge

      - name: 配置 git 身份
        run: |
          git config user.name  'downstream-sync'
          git config user.email 'downstream-sync@users.noreply.github.com'

      - name: 加 upstream remote 并 fetch
        run: |
          git remote add upstream https://github.com/sorryhyun/anima_lora.git || true
          git fetch --no-tags upstream main

      - name: 算 drift
        id: drift
        run: |
          set -euo pipefail
          behind=$(git rev-list --count HEAD..upstream/main)
          ahead=$(git rev-list --count upstream/main..HEAD)
          echo "behind=$behind" >> "$GITHUB_OUTPUT"
          echo "ahead=$ahead"   >> "$GITHUB_OUTPUT"
          echo "upstream_head=$(git rev-parse upstream/main)" >> "$GITHUB_OUTPUT"
          echo "本地领先 $ahead，落后上游 $behind"
          {
            echo "### 上游 $behind 个新提交（本地领先 $ahead）"
            echo ''
            echo '```'
            git log --oneline --no-decorate -n 40 HEAD..upstream/main || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上游没有新东西就收工
        if: steps.drift.outputs.behind == '0'
        run: echo '已经跟上游一致，什么都不用做'

      - name: 合并 upstream/main
        id: merge
        if: steps.drift.outputs.behind != '0'
        run: |
          set +e
          git checkout -B sync/upstream
          git merge --no-edit upstream/main
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "clean=1" >> "$GITHUB_OUTPUT"
            echo "合并干净" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "clean=0" >> "$GITHUB_OUTPUT"
          {
            echo ''
            echo '### ⚠ 合并冲突（需要人工）'
            echo ''
            echo '```'
            git diff --name-only --diff-filter=U || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # 冲突分支照样推上去，PR 里见 —— 退出码 0，让后续步骤（开 PR）还能跑。
          exit 0

      - name: 守卫测试（只在合并干净时）
        if: steps.drift.outputs.behind != '0' && steps.merge.outputs.clean == '1'
        run: |
          python -m pip install --quiet pytest
          python -m pytest tests/test_downstream_guards.py tests/test_gui_i18n_parity.py -q

      - name: 更新基线记录
        if: steps.drift.outputs.behind != '0' && steps.merge.outputs.clean == '1'
        run: |
          printf '%s\n' "${{ steps.drift.outputs.upstream_head }}" > .downstream/upstream-base
          git add .downstream/upstream-base
          git diff --cached --quiet || git commit -m "chore(upstream): advance baseline to $(echo ${{ steps.drift.outputs.upstream_head }} | cut -c1-12)"

      - name: 开同步 PR
        if: steps.drift.outputs.behind != '0'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: sync/upstream
          base: main
          delete-branch: true
          title: "chore(upstream): sync sorryhyun/anima_lora (${{ steps.drift.outputs.behind }} commits)"
          labels: upstream-sync
          body: |
            上游 `sorryhyun/anima_lora` 的新提交合入本下游仓库。

            * 上游 `main`：`${{ steps.drift.outputs.upstream_head }}`
            * 落后提交数：${{ steps.drift.outputs.behind }}
            * 合并是否干净：${{ steps.merge.outputs.clean == '1' && '是' || '否（有冲突，见下方文件清单）' }}

            合并前请看两件事：
            1. `.downstream/patched-upstream-files.txt` 里的补丁文件有没有被上游改到
               （有冲突时 PR 里会直接看到冲突标记）；
            2. 守卫测试 `tests/test_downstream_guards.py` 是否还绿 —— 它守的是我们依赖的
               上游缝合点（`library/env.py` / `runtime/blockswap.py` / `lines/adapters.py` /
               `anima_daemon/client.py` / `downloads.py` / `gui/i18n/*`）。

            详细约定见 `DOWNSTREAM.md`。
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 自动合并（仅 workflow_dispatch 且显式打开）
        if: steps.drift.outputs.behind != '0' && inputs.auto_merge && steps.merge.outputs.clean == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --squash --auto sync/upstream || true
