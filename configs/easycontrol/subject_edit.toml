[preprocess]
caption_shuffle_variants = 4
caption_tag_dropout_rate = 0.0

[training]
network_dim = 32
network_alpha = 32
network_args = [
    "b_cond_init=-4.0",
    "cond_scale=1.0",
    "apply_ffn_lora=1",
    "cond_res_scale=1.0",
]
output_name = "anima_easycontrol_subject_edit"
masked_loss = false
learning_rate = 2e-5
max_train_epochs = 12
save_every_n_epochs = 4
checkpointing_epochs = 4
easycontrol_drop_p = 0.05
easycontrol_cond_noise_max = 0.0
caption_dropout_rate = 0.1
use_shuffled_caption_variants = true
blocks_to_swap = 0

[general]
caption_extension = '.txt'

[[datasets]]
batch_size = 1

  [[datasets.subsets]]
  image_dir = 'post_image_dataset/i2i/{name}/staging'
  cache_dir = 'post_image_dataset/lora'
  cond_cache_dir = 'post_image_dataset/i2i/{name}/cond'
  text_cache_dir = 'post_image_dataset/i2i/{name}/text'
  recursive = true
  flip_aug = false
  num_repeats = 1
