# Krea-2 line —— 512 档 LoRA 训练配置（键 = library/krea2/requests.py 的 TrainRequest 字段）
#
# 口径对齐 krea2-webui 的 **当前** 512 档配置（configs/methods/hiten_krea2_r264_r16_tagnotes_512.toml，
# 2026-10-18 更新）与最近四天的 findings，逐条如下：
#   · target = **official_gate / 264**（= 官方 232 + 32 个 mlp.gate；2026-10-13 起的口径）——
#     r16 下 58.65M 参数。gate 与 mlp.up **同形状、不引入新张量宽度**，所以 8GB 卡能跑；
#     官方/第三方在用的 Krea-2 风格 LoRA 有 17.7–26.4% 的 delta 能量落在这个 gate 上。
#     （attention 160 / official 232 两档保留但不再是口径；`attn_mlp` 196 已弃用。）
#   · σ 采样 + `discrete_flow_shift=1.0` + `weighting_scheme=uniform`（未 shift 的线性网格 + u~U(0,1)）
#   · `lr = 3e-4` constant、warmup 0（2026-10-15 起从 1e-4 上调到官方区间偏保守端）
#   · `train_modulation = false`（2026-10-09 用户决策：一律不开；开了那个键进不了原生路径）
#   · swap 26 + 全程梯度检查点 + `selective_checkpoint=off` + `attn_mode=torch`、不开 compile
#   · 512 档 **不是精确常量 token**（实测 1008/1024/1040/1050/1064；1024 档才是 4032/4200 两族），
#     而且 `bucket_no_upscale=true` ⇒ 桶集直接取自 latent 缓存的 (W,H)：
#     **512 档必须重跑 resize + cache_latents，不能复用 1024 档的 .npz**。
#   · krea2-webui 在**同一台机器**上的实测（512 / official_gate / swap26 / 全梯度检查点）：
#     **7.06–8.55 s/step、reserved 4.41–4.62GB**；1860 步 = 372 张 × 5.0 遍 ≈ 3.6 小时。
#
# 缓存目录用的是 krea2-webui 已经做好的 512 档缓存（**只读**：372 张，
# {stem}_anima.npz 是 56x72 的 latent = 448x576 一类桶；TE 缓存每张 31.46MB）。

cache = "D:/myProject/krea2-webui/post_image_dataset/hiten_512/lora"
output = "output/ckpt_krea2/krea2_hiten_512_r264.safetensors"
output_name = "krea2_hiten_512_r264"
model = "D:/myProject/krea2-webui/models/diffusion_models/krea2_raw_nf4_self_contained.safetensors"

rank = 16
alpha = 16.0
target_preset = "official_gate"
dropout = 0.0

max_steps = 20
batch_size = 1
lr = 3e-4
lr_scheduler = "constant"
warmup_steps = 0
seed = 0
sigma_min = 0.0
sigma_max = 1.0

blocks_to_swap = 26
grad_checkpointing = true
mem_cache_size = 8

save_every_n_steps = 10
save_last_n = 2
log_every_n_steps = 1

# 启动（先设分配器；Windows 不支持 expandable_segments）：
#   $env:PYTORCH_CUDA_ALLOC_CONF="backend:cudaMallocAsync"
#   .\.venv\Scripts\python.exe scripts\krea2\train.py --config configs\krea2\lora.toml
